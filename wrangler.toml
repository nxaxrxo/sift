# Sift — Cloudflare Pages + one D1 database.
#
# Deploy:   npx wrangler pages deploy public --project-name sift
# The `functions/` directory is picked up automatically by Pages; nothing else is
# compiled, bundled or installed, because there is no build step.

name = "sift"
compatibility_date = "2026-01-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "sift-db"
# Replace with the id printed by `npx wrangler d1 create sift-db`.
database_id = "00000000-0000-0000-0000-000000000000"

[vars]
SYNC_STALE_SECONDS = "45"
RETENTION_DAYS = "120"

[observability]
enabled = true
